name: Enforce All Reviewers Approving

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, submitted]

jobs:
  check-reviews:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Get PR reviewers
        id: reviewers
        run: |
          echo "Fetching requested reviewers..."
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN  }}" \
                           -H "Accept: application/vnd.github.v3+json" \
                           "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers")

          echo "Raw API Response: $response"

          REVIEWERS=$(echo "$response" | jq -r '.users[].login' | tr '\n' ' ')
          echo "Parsed reviewers: $REVIEWERS"

          if [[ -z "$REVIEWERS" ]]; then
            echo "::error:: ❌ API did not return any reviewers!"
            exit 1
          fi

          echo "::set-output name=reviewers::$REVIEWERS"

      - name: Get PR approvals
        id: approvals
        run: |
          echo "Fetching approvals..."
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN  }}" \
                           -H "Accept: application/vnd.github.v3+json" \
                           "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews")

          echo "Raw API Response: $response"

          APPROVED=$(echo "$response" | jq -r '.[] | select(.state=="APPROVED") | .user.login' | tr '\n' ' ')
          echo "Parsed approvals: $APPROVED"

          if [[ -z "$APPROVED" ]]; then
            echo "::warning:: ⚠️ No approvals found (yet)."
          fi

          echo "::set-output name=approvals::$APPROVED"

      - name: Check if all reviewers approved
        run: |
          REVIEWERS=($(echo "${{ steps.reviewers.outputs.reviewers }}"))
          APPROVED=($(echo "${{ steps.approvals.outputs.approvals }}"))

          echo "Final Reviewers: ${REVIEWERS[*]}"
          echo "Final Approved: ${APPROVED[*]}"

          MISSING_APPROVALS=0
          for reviewer in $reviewers; do
            if [[ ! " $approved " =~ " $reviewer " ]]; then
              echo "::error:: ❌ Reviewer '$reviewer' has NOT approved the PR!"
              MISSING_APPROVALS=1
            fi
          done

          if [[ $MISSING_APPROVALS -eq 1 ]]; then
            exit 1
          fi

          echo "✅ All reviewers have approved!"
